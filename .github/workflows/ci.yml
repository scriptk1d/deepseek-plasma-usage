#
# Continuous integration for the DeepSeek Usage plasmoid.
#
# These gates mirror the local gauntlet in CONTRIBUTING.md. None of them needs
# Plasma: the applet's logic lives in plain JavaScript modules that node runs
# directly, the catalogue check is gettext + node, and qmllint on Qt 6 resolves no
# imports, so a stock Ubuntu runner can gate the QML syntax too.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue evaluates the required checks against a `gh-readonly-queue/...`
  # ref rather than the branch. This repository cannot switch the queue on — the rule
  # is organisation-only, see docs/decisions-log.md (D55) — but the trigger belongs
  # here so that turning it on is a one-step change rather than a stall, because a
  # required check whose workflow does not run on `merge_group` never reports.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test the pure JS modules
        run: node --test tests/*.test.mjs

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # `npm ci` installs the pinned Prettier, so `npm run format` locally and
      # this job cannot disagree about the result.
      - name: Install dev dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      # The widget ships with no runtime dependencies, so auditing only production
      # dependencies would audit an empty tree and always pass -- a gate that cannot
      # fail is theatre. This audits the whole lockfile, Prettier included, because a
      # compromised dev tool still runs on contributors' machines and inside this
      # workflow. It fails on `high` and `critical` only: a `moderate` advisory in a
      # dev-only tool has no path to a user of the widget, and with nothing in the
      # runtime tree there is usually nothing to upgrade in response.
      - name: Audit the dependency tree
        run: npm audit --audit-level=high

  catalogues:
    name: Translations up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      # Fails if the .po files, LINGUAS or the compiled .mo files would change:
      # the tables in translate/messages/ are the source of truth and everything
      # else is generated.
      - name: Check catalogues
        run: ./translate/build.sh --check
      # And fails if template.pot no longer matches the i18n() calls in the sources,
      # which is the other half of the same guarantee: build.sh --check proves the
      # catalogues match the tables, this proves the tables cover the sources. An
      # i18n() call added without re-extracting is a string missing from every
      # shipped translation, and nothing else notices.
      - name: Check the extracted template
        run: ./translate/merge.sh --check

  qmllint:
    name: QML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools
          # The binary lands here, which is not on PATH by default.
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      # Ubuntu 24.04 ships Plasma 5, so the org.kde.* QML modules this applet
      # imports are not installable next to Qt 6, and qmllint folds "Failed to
      # import" into the same non-zero exit as a parse error. The script narrows
      # that to parse errors; a Plasma 6 machine exits 0 there anyway.
      - name: Lint the QML
        run: tests/lint-qml.sh

  package:
    name: Pack the plasmoid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      # Staging + zipping is what ./install.sh --pack does, and it is the one
      # step whose failure would only surface at release time, so it runs here.
      - name: Build the distribution archive
        run: |
          ./install.sh --pack
          test -s ai-usage.plasmoid
